services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_center}
      POSTGRES_USER: ${POSTGRES_USER:-rag_center}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_center} -d ${POSTGRES_DB:-rag_center}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  qdrant:
    image: qdrant/qdrant:v1.15.5
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  rustfs:
    image: rustfs/rustfs:latest
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rag_center}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rag-center-dev-secret}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      rustfs:
        condition: service_started
    command: ["sh", "-c", "uv run alembic upgrade head && uv run uvicorn rag_center_console.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      rustfs:
        condition: service_started
    command: ["uv", "run", "celery", "-A", "rag_center_console.worker", "worker", "--loglevel=info", "--pool=threads", "--concurrency=2"]

  beat:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    command: ["uv", "run", "celery", "-A", "rag_center_console.worker", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  rustfs_data:
