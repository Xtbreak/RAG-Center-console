[project]
name = "rag-center-console"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Xbreak", email = "1359521763@qq.com" }
]
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "alibabacloud-docmind-api20220711>=1.4.15",
    "boto3>=1.43.118",
    "celery[redis]>=5.6.3",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.15,<1.16",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
    "xlrd>=2.0.2",
]

[project.scripts]
rag-center-console = "rag_center_console:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "moto>=5.2.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
]
